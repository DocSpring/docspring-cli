[package]
name = "docspring-cli"
version = "1.0.1"
edition = "2021"
rust-version = "1.88"
# Its own tests (cargo test in this directory) resolve dependencies that build with rust-version
resolver = "3"
description = "DocSpring's command-line interface: fill PDF and Word templates, generate PDFs and manage templates from your terminal, scripts and CI"
license = "MIT"
authors = ["DocSpring <support@docspring.com>"]
repository = "https://github.com/DocSpring/docspring-cli"
homepage = "https://docspring.com/docs/cli/"
documentation = "https://docspring.com/docs/cli/"
readme = "README.md"
keywords = ["docspring", "pdf", "cli", "e-signature", "api"]
categories = ["command-line-utilities"]
exclude = [".github/", "action.yml", "dist-workspace.toml"]

[[bin]]
name = "docspring"
path = "src/main.rs"

[dependencies]
# Exactly the version the commands were generated from: the commands build each operation's params struct in full
docspring = { version = "=4.5.0", default-features = false, features = ["rustls"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
flate2 = "1"
fs4 = { version = "0.13", features = ["sync"] }
getrandom = "0.3"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls"] }
rpassword = "7"
# Compares release versions the way self_update and cargo do (1.0.0 is newer than 1.0.0-rc.1)
semver = "1"
self_update = { version = "1.3", default-features = false, features = ["github", "reqwest", "rustls", "progress-bar", "archive-tar", "compression-tar-xz", "archive-zip", "compression-zip-deflate", "checksums"] }
serde = { version = "1", features = ["derive"] }
# Output keeps the API's order of properties
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
# Account exports are .tar.gz archives (exports download)
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "fs"] }
toml = "0.9"
url = "2"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

# The profile that dist builds release binaries with
[profile.dist]
inherits = "release"
